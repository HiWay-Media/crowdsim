# The stand-in target for the end-to-end test: a static site that answers every path in the pools and
# declares a cache header, so the whole chain — profile → generator → classification → summary → history
# — is exercised against a real socket at a rate that cannot hurt anything.
#
# It is NOT a model of a real frontend: nothing here queues, so this suite proves the plumbing works, not
# that the numbers mean anything. Finding a knee needs a system that can actually saturate.

events { worker_connections 256; }

http {
  access_log off;
  server_tokens off;
  default_type text/html;

  server {
    listen 80;

    # Every response declares a proxy cache state, which is what the profile's cache_headers classify.
    add_header X-Proxy-Cache "HIT" always;

    # A sitemap, so `discover` has something to discover — with two paths that must NOT survive
    # `--verify`: one that 404s and one that redirects. A pool full of either yields a flattering capacity
    # number for a load that never reached the renderer.
    location = /sitemap.xml {
      add_header Content-Type application/xml always;
      return 200 '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n<url><loc>http://127.0.0.1:18080/</loc></url>\n<url><loc>http://127.0.0.1:18080/news</loc></url>\n<url><loc>http://127.0.0.1:18080/news/latest</loc></url>\n<url><loc>http://127.0.0.1:18080/gone</loc></url>\n<url><loc>http://127.0.0.1:18080/moved</loc></url>\n</urlset>\n';
    }

    location = /gone  { return 404 "gone\n"; }
    location = /moved { return 301 "/"; }

    location = /nocache {
      add_header X-Proxy-Cache "MISS" always;
      return 200 "miss\n";
    }

    # Static assets: a distinct class in the mix, and the one that must NOT be counted as a page.
    location /assets/ {
      add_header X-Proxy-Cache "HIT" always;
      return 200 "asset\n";
    }

    # ── the authenticated leg ────────────────────────────────────────────────────────────────────
    # Every bug the authenticated classes have shipped lived in the WIRING, where a unit test cannot go:
    # the login could not read its own body, a credentials file with no accounts made the class vanish,
    # and nothing counted a 401. These four endpoints are the smallest thing that exercises all of it.

    # A token endpoint whose body is WRAPPED — `data.access_token`, not `access_token`. That is the shape
    # that broke: the run sets discardResponseBodies, so res.body was undefined, JSON.parse(undefined)
    # returns undefined instead of throwing in k6's runtime, and reading .error off it threw a TypeError
    # on every iteration of both authenticated classes. Three releases of unit tests never saw it,
    # because a unit test calls parseToken with a string.
    location = /auth/token {
      add_header Content-Type application/json always;
      return 200 '{"data":{"access_token":"e2e-access-token","refresh_token":"e2e-refresh-token","expires_in":300}}';
    }

    # A token endpoint that answers 200 with NO usable token. It must be counted (cs_auth_fail) and
    # reported as `no token:`, not silently produce a class that sends nothing.
    location = /auth/token-empty {
      add_header Content-Type application/json always;
      return 200 '{"data":{"nothing_here":true}}';
    }

    # A read that actually requires the header. 401 without it — which is also what `probe` checks
    # before any load, so this endpoint is the positive case of that guard.
    location = /api/me {
      if ($http_authorization = "") { return 401; }
      add_header Content-Type application/json always;
      return 200 '{"id":"e2e-user","entitlements":["live"]}';
    }

    # A read that does NOT require the header: the failure `probe` refuses, reproduced on purpose.
    location = /api/public-whoami {
      add_header Content-Type application/json always;
      return 200 '{"id":"anonymous"}';
    }

    # Registration. The signup class had never run against any target, not even a local one.
    location = /auth/signup {
      add_header Content-Type application/json always;
      return 201 '{"id":"registered"}';
    }

    # Everything else is a "page": one small document, served for any path and any query string, so the
    # RSC navigation requests (which differ only by ?_rsc=...) all resolve.
    location / {
      return 200 "<html><body>crowdsim e2e target</body></html>\n";
    }
  }
}
