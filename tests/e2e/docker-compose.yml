# A local target for the end-to-end suite. Loopback only, on a port unlikely to be in use.
services:
  target:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 10
