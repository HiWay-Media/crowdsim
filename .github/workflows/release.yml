# Publish a GitHub Release when a version tag is pushed.
#
# The notes are the CHANGELOG section for that version, extracted by scripts/new-release.sh — the same
# text a human wrote and reviewed. Notes generated from commit subjects are notes nobody reads, and this
# project's rule is that every change ships as a version with its reasoning written down.
#
# It refuses rather than improvises: a tag with no CHANGELOG section fails the job. That failure is the
# point — it means the release was tagged without being described, and the fix is to describe it.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish a release for
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0            # the script reads tags

      # Every value that reaches a `run:` block does so through env, never through `${{ }}` pasted into the
      # script: a tag name is chosen by whoever pushes the tag, and pasted text is code.
      - name: Work out the version
        id: v
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          ref="$REF"
          version="${ref#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$ref' is not a vX.Y.Z tag"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Check the version bump landed with the tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          in_pkg=$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')
          if [ "$in_pkg" != "$VERSION" ]; then
            echo "::error::package.json says $in_pkg but the tag says $VERSION —" \
                 "the tag does not point at the release commit"
            exit 1
          fi

      # The notes go to a FILE and are handed over with --notes-file. They must never travel through a
      # shell string: a `${{ }}` expression is pasted into the script before bash parses it, and inside
      # double quotes bash still honours backticks and $( ) — so a CHANGELOG section written in this
      # project's own voice (which is full of `code spans` and ``` fences) gets executed instead of
      # published. That is how 1.5.2 failed to release: the notes ran `make test-gui` and a `docker pull`.
      - name: Extract the release notes from the CHANGELOG
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x scripts/new-release.sh
          # GHCR rejects an uppercase path, and the org name has capitals: the image is published under the
          # lowercased name by docker/metadata-action, so the pull command in the notes must match it or it
          # is a copy-pasteable error.
          image="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          {
            scripts/new-release.sh notes "$VERSION"
            printf '\n---\n\n**Container image**\n\n'
            printf '```\ndocker pull %s:%s\n```\n\n' "$image" "$VERSION"
            printf 'Install and usage: [docs/docker.md](https://github.com/%s/blob/%s/docs/docker.md)\n' \
              "$REPO" "$TAG"
          } > "$RUNNER_TEMP/notes.md"
          echo "Release notes: $(wc -l < "$RUNNER_TEMP/notes.md") lines" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "crowdsim $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
            echo "Updated the existing release." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" \
              --title "crowdsim $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
            echo "Published crowdsim $VERSION." >> "$GITHUB_STEP_SUMMARY"
          fi
