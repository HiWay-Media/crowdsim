# The suite that actually generates load, on a runner, against targets the runner owns.
#
# Everything else in CI asserts decisions against fakes. This one starts a real k6 process against real
# HTTP servers and checks the three conclusions the tool exists to produce:
#
#   leg 1  a healthy target does NOT trip the brake, and the mix, the cache classification and the
#          archive all come out right
#   leg 2  a target past its capacity DOES trip it — early, with the generator still holding the rate
#   leg 3  a target that never answers is reported as CONNECTIVITY, not as capacity
#
# ⚠️ On what it generates load AGAINST: two containers on the runner's own loopback, plus a refused
#    connection to 127.0.0.1:9. Nothing leaves the runner. Leg 3 uses `www.example.test` — reserved by
#    RFC 6761 and absent from the global DNS — and does not even resolve it: the profile's bypass sends the
#    connection to loopback, so a resolver that hijacks NXDOMAIN cannot turn this into load against a
#    stranger. `example.com` would be somebody's real infrastructure and is never a target here.
name: e2e

on:
  push:
    branches: [main]
    paths:
      - bin/**
      - k6/**
      - lib/**
      - gui/server/**
      - tests/e2e/**
      - profiles/example.json
      - Makefile
      - .github/workflows/e2e.yml
  pull_request:
    paths:
      - bin/**
      - k6/**
      - lib/**
      - gui/server/**
      - tests/e2e/**
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A hard cap, for the same reason the Kubernetes Job has activeDeadlineSeconds: the whole suite is
    # under two minutes of traffic, so anything approaching this means something is hung.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The suite ends by starting the GUI server and asserting it reads the same archive, so express has
      # to be installed. It never installs k6 through npm: see below.
      - run: npm ci

      # k6 natively, from Grafana. Not through Docker: the container network layer would sit between the
      # generator and the target, which is the one thing this suite must not measure.
      - uses: grafana/setup-k6-action@v1

      # The suite's last leg loads the real page in a real browser. Without a build there is no page, so it
      # skipped — quietly, on every run, which is the same as not having the check. Chrome itself is already
      # on the runner image.
      - name: Build the UI, so the rendered-page check has something to render
        run: npm run gui:build

      - name: Prerequisites are really present
        run: |
          k6 version
          docker version --format '{{.Server.Version}}'
          test -f gui/ui/dist/index.html || { echo "::error::the UI was not built: the page check would skip"; exit 1; }
          command -v google-chrome-stable >/dev/null || command -v google-chrome >/dev/null \
            || echo "::warning::no Chrome on this runner: the rendered-page check will skip"
          # If any were missing the suite would SKIP with exit 0 — correct on a laptop, useless here.
          # Fail loudly instead, so a runner image change cannot turn this job into a green no-op.

      - name: End-to-end suite
        run: make test-e2e

      # The summaries and logs of all three runs. On a failure they are the only way to tell a real
      # regression from a runner having a bad day.
      - name: Keep the run archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: tests/e2e/.out/
          retention-days: 7
          if-no-files-found: warn

  # The same suite, against the k6 the IMAGE pins — because the job above installs whatever is newest, and
  # for eleven releases that meant the generator users receive had never been the generator the evidence
  # came from. Two majors apart at the time this was written (0.52.0 shipped, 2.x tested).
  #
  # The brake is the reason this matters: it is a k6 threshold with abortOnFail, so a changed threshold
  # syntax or a renamed metric produces a run that no longer stops — and the first person to find out would
  # be whoever is watching the outage it existed to cut short.
  e2e-pinned:
    name: e2e against the k6 the image ships
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run gui:build

      # Read from the Dockerfile, so the pin has one home and bumping it is one edit.
      - name: The k6 version the image pins
        id: pin
        run: |
          v=$(grep -oE 'grafana/k6:[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d: -f2)
          [ -n "$v" ] || { echo "::error::no k6 pin found in the Dockerfile"; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "the image ships k6 $v"

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ steps.pin.outputs.value }}

      - name: It really is the pinned version
        run: |
          k6 version
          k6 version | grep -q "v${{ steps.pin.outputs.value }}" \
            || { echo "::error::the runner has a different k6 than the image pins"; exit 1; }

      - name: End-to-end suite
        run: make test-e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-archive-pinned-k6
          path: tests/e2e/.out/
          retention-days: 7
