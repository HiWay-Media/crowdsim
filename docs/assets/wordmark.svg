<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96"
     role="img" aria-label="crowdsim — load simulator for live events">
  <title>crowdsim — load simulator for live events</title>
  <!-- Banner form of the mark: used at the top of README.md. -->
  <defs>
    <linearGradient id="wm-ramp" x1="12" y1="76" x2="80" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="0.55" stop-color="#6D5EF7"/>
      <stop offset="1" stop-color="#8B7BFF"/>
    </linearGradient>
    <clipPath id="wm-overshoot">
      <rect x="66" y="18" width="12" height="16"/>
    </clipPath>
  </defs>

  <g fill="url(#wm-ramp)">
    <rect x="12" y="57" width="12" height="19" rx="6"/>
    <rect x="30" y="47" width="12" height="29" rx="6"/>
    <rect x="48" y="34" width="12" height="42" rx="6"/>
    <rect x="66" y="18" width="12" height="58" rx="6"/>
  </g>
  <g clip-path="url(#wm-overshoot)">
    <rect x="66" y="18" width="12" height="58" rx="6" fill="#FF4D4F"/>
  </g>
  <path d="M6 34 H86" stroke="#8A93AD" stroke-width="2.6" stroke-linecap="round"
        stroke-dasharray="5 5"/>

  <text x="104" y="52" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace"
        font-size="38" font-weight="600" letter-spacing="-0.5" fill="#6D5EF7">crowdsim</text>
  <text x="106" y="74" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="14.5" letter-spacing="0.6" fill="#8A93AD">load simulator for live events</text>
</svg>
